services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - parking-data:/var/lib/postgresql/data
      - ./packages/database:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  parking-data:
