name: Geocoding live - manual only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Five controlled official geocoding requests
        run: |
          mkdir -p artifacts
          npm run test:geocoding:live 2>&1 | tee artifacts/geocoding-live.log
      - name: Save live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocoding-live-${{ github.run_id }}
          path: artifacts/geocoding-live.log
          if-no-files-found: warn
          retention-days: 14
