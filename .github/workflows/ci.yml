name: CI - PostGIS Lyon API Web
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: PostgreSQL 17 / PostGIS 3.5 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      # Disposable test credentials. No GitHub secret or production database needed.
      POSTGRES_PASSWORD: ci-ephemeral-password
      DATABASE_URL: postgresql://parking:ci-ephemeral-password@127.0.0.1:5432/parking
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare logs
        run: mkdir -p artifacts
      - name: Install locked dependencies
        run: npm ci 2>&1 | tee artifacts/npm-ci.log
      - name: Start PostgreSQL 17 and PostGIS 3.5
        run: npm run db:up 2>&1 | tee artifacts/db-start.log
      - name: Wait for a real SQL connection
        run: npm run db:wait 2>&1 | tee artifacts/db-wait.log
      - name: Verify installed PostGIS extension and version
        run: npm run db:check 2>&1 | tee artifacts/postgis-version.log
      - name: Apply all migrations including DiaLog and Lyon
        run: npm run db:migrate 2>&1 | tee artifacts/migrations.log
      - name: Check migration replay is a no-op
        run: npm run db:migrate 2>&1 | tee artifacts/migrations-replay.log
      - name: SQL and PostGIS tests
        run: npm run test:db 2>&1 | tee artifacts/sql-tests.log
      - name: Real database integrations including DiaLog and Lyon XML to engine
        run: npm run test:integration 2>&1 | tee artifacts/integration.log
      - name: Spatial query EXPLAIN ANALYZE BUFFERS
        run: npm run db:explain 2>&1 | tee artifacts/explain.log
      - name: TypeScript strict
        run: npm run typecheck 2>&1 | tee artifacts/typecheck.log
      - name: Unit tests including offline geocoding DiaLog and Lyon
        run: npm test 2>&1 | tee artifacts/unit-tests.log
      - name: Reproduce official Lyon street matching offline
        run: npm run lyon:coverage -- --file data/lyon/roads.geojson 2>&1 | tee artifacts/lyon-coverage.log
      - name: Fictional demo
        run: npm run demo 2>&1 | tee artifacts/demo.log
      - name: Build production API and web
        run: npm run build 2>&1 | tee artifacts/build.log
      - name: Install Chromium for deterministic browser tests
        run: npx playwright install --with-deps chromium 2>&1 | tee artifacts/browser-install.log
      - name: Mobile and desktop E2E without public APIs
        run: npm run test:e2e 2>&1 | tee artifacts/e2e.log
      - name: Build Railway staging image
        run: docker build -t jps-staging . 2>&1 | tee artifacts/staging-image.log
      - name: Smoke test production container
        run: |
          docker run -d --name jps-staging --network host -e DATABASE_URL -e PORT=4185 -e APP_ORIGIN=http://127.0.0.1:4185 jps-staging
          trap 'docker logs jps-staging > artifacts/staging-http.log 2>&1; docker rm -f jps-staging' EXIT
          node --input-type=module <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          let ready=false;
          for(let i=0;i<30;i++) {
            try { const r=await fetch('http://127.0.0.1:4185/api/ready');if(r.ok){ready=true;break;} } catch {}
            await delay(1000);
          }
          if(!ready)throw new Error('Production container readiness failed');
          for(const path of ['/api/health','/']) {
            const r=await fetch('http://127.0.0.1:4185'+path);
            if(!r.ok)throw new Error('Production HTTP smoke failed');
          }
          console.log('PASS production container health, readiness and static web');
          JS
      - name: Collect database container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color db > artifacts/postgres-container.log 2>&1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-validation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable CI database
        if: always()
        run: docker compose down --volumes
